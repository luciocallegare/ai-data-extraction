services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: extract

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/extract}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "4000:4000"
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/src
        - action: sync
          path: ./apps/api/prompts
          target: /app/prompts
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/api/tsconfig.json

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Browser-side API client hits the host-mapped port.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/src
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/next.config.ts
        - action: rebuild
          path: ./apps/web/tsconfig.json
        - action: rebuild
          path: ./apps/web/postcss.config.mjs

volumes:
  mongo-data: